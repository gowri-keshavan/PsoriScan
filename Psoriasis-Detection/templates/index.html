<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psoriasis Detection Tool</title>
</head>
<body>
    <h1>Upload a Skin Image</h1>
    <form action="/" method="post" enctype="multipart/form-data">
        <input type="file" name="image" accept="image/*" required>
        <button type="submit">Detect Psoriasis</button>
    </form>

    {% if label %}
        <h2>Prediction: {{ label }}</h2>
        <h3>Confidence: {{ confidence }}%</h3>
        <h3>Original Image:</h3>
        <img src="{{ original_img }}" alt="Original Image" width="300">
        <h3>Highlighted Image:</h3>
        <img src="{{ output_img }}" alt="Highlighted Image" width="300">
    {% endif %}
</body>
</html>
