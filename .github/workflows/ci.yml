name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -m "not slow"

  ml-smoke:
    # Trains a tiny model for one epoch on synthetic images, evaluates it and serves one prediction.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [tf, torch]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - if: matrix.backend == 'tf'
        run: pip install -r requirements-tf.txt
      - if: matrix.backend == 'torch'
        run: pip install --index-url https://download.pytorch.org/whl/cpu -r requirements-torch.txt
      - run: pytest -m slow -k ${{ matrix.backend }}

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watchAll=false
      - run: npm run build
        env:
          CI: "true"
